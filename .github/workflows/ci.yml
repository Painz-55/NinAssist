name: Build and tests
on:
  push:
    branches: [ main, master ]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test NinOnlineAutoAssist.sln -c Release
      - run: dotnet build NinOnlineAutoAssist.sln -c Release --no-restore
